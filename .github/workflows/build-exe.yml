name: Build Sylvan EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build EXE Windows
    runs-on: windows-latest

    steps:
      - name: 📥 Lấy mã nguồn
        uses: actions/checkout@v5

      - name: 📦 Cài Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: 🩹 Vá lỗi Qt 5.15.2 (stdext)
        shell: python
        run: |
          import os, sys

          qt_root = os.environ.get('QT_ROOT_DIR')
          if not qt_root or not os.path.isdir(qt_root):
              raise SystemExit('LOI: QT_ROOT_DIR khong hop le: ' + repr(qt_root))

          qt_inc = os.path.join(qt_root, 'include')

          compat = '''#pragma once
          template <typename T, typename... Args>
          inline T make_checked_array_iterator(T it, Args&&...) { return it; }
          '''
          compat = '\n'.join(line.strip() for line in compat.strip().split('\n')) + '\n'
          header_path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'stdext_compat.h')
          with open(header_path, 'w') as f:
              f.write(compat)
          print('Da tao header: ' + header_path)

          token = 'stdext::make_checked_array_iterator'
          patched = 0
          for dirpath, _, filenames in os.walk(qt_inc):
              for name in filenames:
                  if not name.endswith(('.h', '.cpp', '.ipp', '.hpp')):
                      continue
                  path = os.path.join(dirpath, name)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                  except OSError:
                      continue
                  if token in content:
                      with open(path, 'w', encoding='utf-8', errors='ignore') as f:
                          f.write(content.replace(token, 'make_checked_array_iterator'))
                      patched += 1
                      print('Da va: ' + path)

          if patched == 0:
              print('CANH BAO: Khong tim thay token nao de va!')

          print('Tong cong da va %d file.' % patched)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('CL=/FI%s\n' % header_path)
          print('Da thiet lap CL=/FI' + header_path)

      - name: ⚙️ Chuẩn bị trình biên dịch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 🔧 Tạo cấu hình
        run: qmake sylvan.pro -spec win32-msvc "CONFIG+=release"

      - name: 🔨 Biên dịch
        run: nmake

      - name: 📁 Sao chép tệp EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\release -Force | Out-Null

          $exe = Get-ChildItem -Path . -Recurse -Filter "sylvan.exe" |
            Where-Object { $_.FullName -notlike "*\release\*" } |
            Select-Object -First 1

          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination .\release\ -Force
            Write-Host "Da copy: (((exe.FullName)"
          }

          if (-not (Test-Path .\release\sylvan.exe)) {
            throw "LOI: Khong tim thay sylvan.exe sau khi build."
          }

      - name: 📦 Đóng gói thư viện kèm theo
        shell: cmd
        run: |
          set PATH=%QT_ROOT_DIR%\bin;%PATH%
          if not exist release\sylvan.exe exit /b 1
          windeployqt release\sylvan.exe --release --no-translations

          rem Dam bao co plugin SVG (quan co duoc ve bang SVG)
          if not exist release\imageformats mkdir release\imageformats
          xcopy /Y /I "%QT_ROOT_DIR%\plugins\imageformats\qsvg.dll" release\imageformats\
          if not exist release\Qt5Svg.dll copy /Y "%QT_ROOT_DIR%\bin\Qt5Svg.dll" release\

          rem Icon SVG (neu dung)
          if not exist release\iconengines mkdir release\iconengines
          xcopy /Y /I "%QT_ROOT_DIR%\plugins\iconengines\qsvgicon.dll" release\iconengines\

          rem Sao chep thu muc tai nguyen neu du an co (pieces/themes/styles)
          if exist pieces      xcopy /E /I /Y pieces      release\pieces
          if exist themes      xcopy /E /I /Y themes      release\themes
          if exist styles      xcopy /E /I /Y styles      release\styles

          echo === Noi dung release ===
          dir /B release
          dir /B release\imageformats

      - name: 📤 Nén thành tệp ZIP
        shell: cmd
        run: powershell -NoProfile -Command "Compress-Archive -Path .\release\* -DestinationPath .\Sylvan-Windows.zip -Force"

      - name: ✅ Tải kết quả lên
        uses: actions/upload-artifact@v5
        with:
          name: Sylvan-EXE-Windows
          path: .\Sylvan-Windows.zip
