name: Build Sylvan EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build EXE Windows
    runs-on: windows-latest

    steps:
      - name: 📥 Lấy mã nguồn
        uses: actions/checkout@v5

      - name: 📦 Cài Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: 🩹 Vá lỗi Qt 5.15.2 (stdext::make_checked_array_iterator)
        shell: python
        run: |
          import os, sys

          qt_root = os.environ.get('QT_ROOT_DIR')
          if not qt_root or not os.path.isdir(qt_root):
              raise SystemExit('LOI: QT_ROOT_DIR khong hop le: ' + repr(qt_root))

          qt_inc = os.path.join(qt_root, 'include')

          # 1. Ghi header tuong thuc
          compat = '''#pragma once
          namespace stdext_compat {
          template <typename T, typename... Args>
          inline T make_checked_array_iterator(T it, Args&&...) { return it; }
          }
          using stdext_compat::make_checked_array_iterator;
          '''
          compat = '\n'.join(line.strip() for line in compat.strip().split('\n')) + '\n'
          header_path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'stdext_compat.h')
          with open(header_path, 'w') as f:
              f.write(compat)
          print('Da tao header: ' + header_path)

          # 2. Doi ten stdext::make_checked_array_iterator thanh ban tuong thuc
          #    (chi doi TEN, khong dong den ngoac -> khong the lam hong cu phap)
          token = 'stdext::make_checked_array_iterator'
          patched_files = 0
          for dirpath, _, filenames in os.walk(qt_inc):
              for name in filenames:
                  if not name.endswith(('.h', '.cpp', '.ipp', '.hpp')):
                      continue
                  path = os.path.join(dirpath, name)
                  try:
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                  except OSError:
                      continue
                  if token in content:
                      new_content = content.replace(token, 'make_checked_array_iterator')
                      with open(path, 'w', encoding='utf-8', errors='ignore') as f:
                          f.write(new_content)
                      patched_files += 1
                      print('Da va: ' + path)

          if patched_files == 0:
              print('CANH BAO: Khong tim thay token nao de va!')
              print('Kiem tra thu muc: ' + qt_inc)

          print('Tong cong da va %d file.' % patched_files)

          # 3. Buoc cl tu dong include header nay trong MOI file dich
          #    (bien CL duoc noi vao dau dong lenh cua moi lan goi cl)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('CL=-FI%s\n' % header_path)
          print('Da thiet lap CL=' + '-FI' + header_path)

      - name: 🔍 Kiểm tra không còn sót stdext
        shell: python
        run: |
          import os, sys

          qt_inc = os.path.join(os.environ['QT_ROOT_DIR'], 'include')
          leftover = []
          for dirpath, _, filenames in os.walk(qt_inc):
              for name in filenames:
                  if not name.endswith(('.h', '.cpp', '.ipp', '.hpp')):
                      continue
                  path = os.path.join(dirpath, name)
                  with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                      if 'stdext::make_checked_array_iterator' in f.read():
                          leftover.append(path)

          if leftover:
              for p in leftover:
                  print('VAN CON SOT: ' + p)
              sys.exit(1)
          print('OK: Khong con stdext::make_checked_array_iterator nao trong Qt include.')

      - name: ⚙️ Chuẩn bị trình biên dịch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 🔧 Tạo cấu hình
        run: qmake sylvan.pro -spec win32-msvc "CONFIG+=release"

      - name: 🔨 Biên dịch
        run: nmake

      - name: 📁 Sao chép tệp EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\release -Force
          Get-ChildItem -Path . -Recurse -Filter "sylvan.exe" | Copy-Item -Destination .\release\
          Get-ChildItem -Path . -Recurse -Filter "sylvan-cli.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination .\release\

      - name: 📦 Đóng gói thư viện kèm theo
        shell: powershell
        run: |
          env:PATH="env:PATH = "env:PATH="env:QT_ROOT_DIR\bin;$env:PATH"
          windeployqt .\release\sylvan.exe --release --no-translations

      - name: 📤 Nén thành tệp ZIP
        shell: powershell
        run: Compress-Archive -Path .\release\* -DestinationPath .\Sylvan-Windows.zip

      - name: ✅ Tải kết quả lên
        uses: actions/upload-artifact@v5
        with:
          name: Sylvan-EXE-Windows
          path: .\Sylvan-Windows.zip
