name: Build Sylvan EXE

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build EXE Windows
    runs-on: windows-latest

    steps:
      - name: 📥 Lấy mã nguồn
        uses: actions/checkout@v4

      - name: 📦 Cài Qt 5.15
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: 🩹 Vá lỗi Qt 5.15.2 với MSVC mới (stdext đã bị xóa)
        shell: powershell
        run: |
          qtInc=Join−PathqtInc = Join-PathqtInc=Join−Pathenv:QT_ROOT_DIR 'include\QtCore'
          if (-not (Test-Path $qtInc)) {
            Write-Error "Khong tim thay thu muc Qt include: $qtInc"
            exit 1
          }
          foreach ($f in @('qglobal.h', 'qvector.h')) {
            p=Join−Pathp = Join-Pathp=Join−PathqtInc $f
            if (Test-Path $p) {
              content=Get−Contentcontent = Get-Contentcontent=Get−Contentp -Raw
              patched=patched =patched=content -replace 'stdext::make_checked_array_iterator\([^)]*\)', 'x'
              if (patched−nepatched -nepatched−necontent) {
                Set-Content -Path p−Valuep -Valuep−Valuepatched -NoNewline
                Write-Host "Da va $p"
              } else {
                Write-Host "Khong co gi de va trong $p"
              }
            }
          }

      - name: ⚙️ Chuẩn bị trình biên dịch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 🔧 Tạo cấu hình
        run: qmake sylvan.pro -spec win32-msvc "CONFIG+=release"

      - name: 🔨 Biên dịch
        run: nmake

      - name: 📁 Sao chép tệp EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\release -Force
          Get-ChildItem -Path . -Recurse -Filter "sylvan.exe" | Copy-Item -Destination .\release\
          Get-ChildItem -Path . -Recurse -Filter "sylvan-cli.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination .\release\

      - name: 📦 Đóng gói thư viện kèm theo
        shell: powershell
        run: |
          env:PATH="env:PATH = "env:PATH="env:QT_ROOT_DIR\bin;$env:PATH"
          windeployqt .\release\sylvan.exe --release --no-translations

      - name: 📤 Nén thành tệp ZIP
        shell: powershell
        run: Compress-Archive -Path .\release\* -DestinationPath .\Sylvan-Windows.zip

      - name: ✅ Tải kết quả lên
        uses: actions/upload-artifact@v4
        with:
          name: Sylvan-EXE-Windows
          path: .\Sylvan-Windows.zip
